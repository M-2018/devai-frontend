<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-white tracking-tight">Consola de Ingeniería Aider</h2>
    <p class="text-sm text-slate-400 mt-1">Ejecuta comandos asistidos por IA sobre tu repositorio backend en .NET 10.</p>
  </div>

  <div class="bg-[#0f172a] border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col h-[650px]">
    <div class="flex justify-between items-center mb-4 pb-4 border-b border-slate-800">
      <div class="flex items-center space-x-2">
        <span class="h-3 w-3 rounded-full bg-indigo-500 animate-ping"></span>
        <span class="text-xs font-mono text-indigo-400 uppercase tracking-wider">Aider CLI Terminal Activa</span>
      </div>
      <div class="text-xs text-slate-400 font-mono">Modo: Auto-refactor .NET 10</div>
    </div>

    <!-- Terminal de Logs -->
    <div class="flex-1 bg-[#0b0f19] border border-slate-800 rounded-xl p-4 font-mono text-xs text-slate-300 overflow-y-auto space-y-2">
      <div *ngFor="let log of logs" [ngClass]="{'text-indigo-400': log.includes('[Aider Output]'), 'text-emerald-400': log.includes('[Ready]')}">
        {{ log }}
      </div>
    </div>

    <!-- Entrada de comandos -->
    <div class="mt-4 pt-4 border-t border-slate-800 space-y-3">
      <div class="relative">
        <input 
          [(ngModel)]="promptText" 
          (keyup.enter)="runAiderFeature()"
          [disabled]="isLoading"
          type="text" 
          placeholder="Ej: Implementar patrón Repository para C# / ¿Dónde está la lógica de cálculo?" 
          class="w-full bg-[#0b0f19] border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition font-mono disabled:opacity-50">
      </div>
      
      <div class="flex justify-between items-center">
        <div class="flex space-x-2">
          <button (click)="runAiderFeature()" [disabled]="isLoading" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-medium transition disabled:opacity-50">
            ✨ {{ isLoading ? 'Ejecutando...' : 'Ejecutar Aider Feature' }}
          </button>
          <button (click)="runAnalyzeCode()" [disabled]="isLoading" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium transition border border-slate-700 disabled:opacity-50">
            💬 Consultar Código (/analyze)
          </button>
        </div>
        <span class="text-[11px] text-slate-500 font-mono">Presiona Enter para enviar</span>
      </div>
    </div>
  </div>
</div>
