<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-white tracking-tight">Chat Inteligente</h2>
    <p class="text-sm text-slate-400 mt-1">Conversa directamente con la IA sobre la arquitectura y el código de tu backend en .NET 10.</p>
  </div>

  <div class="bg-[#0f172a] border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col h-[650px]">
    <div class="flex justify-between items-center mb-4 pb-4 border-b border-slate-800">
      <div class="flex items-center space-x-2">
        <span class="h-3 w-3 rounded-full bg-emerald-500"></span>
        <span class="text-xs font-mono text-slate-300 uppercase tracking-wider">Asistente Gemini AI Conectado</span>
      </div>
      <div class="text-xs text-indigo-400 font-mono">Contexto: .NET 10 + PostgreSQL</div>
    </div>

    <!-- Lista de Mensajes -->
    <div class="flex-1 bg-[#0b0f19] border border-slate-800 rounded-xl p-4 overflow-y-auto space-y-4">
      <div *ngFor="let msg of messages" class="flex items-start space-x-3" [ngClass]="{'flex-row-reverse space-x-reverse': msg.sender === 'user'}">
        <div [ngClass]="msg.sender === 'user' ? 'bg-indigo-600' : 'bg-slate-700'" class="h-8 w-8 rounded-xl flex items-center justify-center text-white text-xs font-bold flex-shrink-0 shadow-md">
          {{ msg.sender === 'user' ? 'TÚ' : 'AI' }}
        </div>
        <div [ngClass]="msg.sender === 'user' ? 'bg-indigo-600/20 border-indigo-500/30' : 'bg-[#0f172a] border-slate-800'" class="border rounded-2xl p-4 text-sm text-slate-200 max-w-2xl">
          <p class="whitespace-pre-wrap">{{ msg.text }}</p>
          <span class="text-[10px] text-slate-500 mt-2 block text-right font-mono">{{ msg.time }}</span>
        </div>
      </div>

      <div *ngIf="isLoading" class="flex items-center space-x-2 text-xs text-slate-400 font-mono p-2">
        <span class="h-2 w-2 rounded-full bg-indigo-500 animate-bounce"></span>
        <span>Escribiendo respuesta...</span>
      </div>
    </div>

    <!-- Control de Envío -->
    <div class="mt-4 pt-4 border-t border-slate-800 flex items-center space-x-3">
      <input 
        [(ngModel)]="userQuery" 
        (keyup.enter)="sendMessage()" 
        [disabled]="isLoading"
        type="text" 
        placeholder="Escribe tu consulta sobre el código o la arquitectura..." 
        class="flex-1 bg-[#0b0f19] border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition disabled:opacity-50">
      <button (click)="sendMessage()" [disabled]="isLoading" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl text-sm font-medium transition shadow-lg shadow-indigo-600/30 flex items-center space-x-2 disabled:opacity-50">
        <span>{{ isLoading ? 'Enviando...' : 'Enviar' }}</span>
        <span>🚀</span>
      </button>
    </div>
  </div>
</div>
